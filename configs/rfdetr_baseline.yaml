project:
  seed: 42

raw_data:
  root: data/数据

processed_data:
  root: data/processed/rfdetr_pollen_v2

model:
  name: RF-DETR-Nano
  type: nano

dataset:
  format: COCO
  classes: 15
  path: data/processed/rfdetr_pollen_v2

data_split:
